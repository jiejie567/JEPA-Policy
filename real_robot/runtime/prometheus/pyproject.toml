[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prometheus-v3"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "hydra-core>=1.3,<1.4",
    "msgpack>=1.0",
    "numpy>=1.26",
    "omegaconf>=2.3,<2.4",
    "websockets>=12",
]

[tool.setuptools.packages.find]
include = ["prometheus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
