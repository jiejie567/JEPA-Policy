run:
  id: replay_noop
  output_dir: /private/tmp/prometheus_v3_replay_noop/output
  runtime_dir: ${run.output_dir}/runtime
  wait_ready_timeout_s: 1.0

robot:
  _target_: prometheus.nodes.robots.noop.resolve_robot
  id: noop
  action_space: abs_qpos
  action_dim: 14
  control_domain_id: 0
  sensor_domain_id: 0
  streams: {}
  client:
    _target_: tests.noop.NoopRobotClient
    action_space: ${robot.action_space}
    action_dim: ${robot.action_dim}

task:
  id: replay_task
  prompt:
    - replay task
  subtasks: []
  metadata: {}

hardware:
  name: hardware
  mode: owned
  sensors: {}
  streams: {}

scheduler:
  _target_: prometheus.policy.scheduler.ActionScheduler
  dry_run: false
  wait: true
  timeout_s: 3.0
  history: 1024
  filters: []

workflow:
  input: /tmp/replay_input
  control_mode: joint
  action_hz: 30.0
  reset_home_timeout_s: 1.0
