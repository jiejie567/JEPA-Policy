_target_: prometheus.policy.jepa_policy.JEPAPolicy

inputs:
  anchor: base_0_color
  slop_ms: 60.0
  # Prometheus publishes at 30 Hz; JEPA-Policy was trained on 2 frames at 10 Hz.
  window_size: 2
  stride: 3
  # Let each RealSense publish and decode about two seconds of RGB before the
  # first inference so auto-exposure/white-balance startup frames are not used.
  startup_camera_frames: 60
  wait_latest: true
  # Give the asynchronous RGB/state decoders time to reach the same raw
  # timestamps. The 60 ms alignment limit remains strict after the wait.
  wait_latest_timeout_ms: 100.0
  # A chunk-boundary barrier may deliberately target one full 10 Hz period in
  # the future. Live traces also show occasional synchronized RealSense publish
  # pauses of about 386 ms, so allow recovery without accepting a stale frame.
  observation_barrier_timeout_ms: 1000.0
  camera_streams:
    base_image: base_0_color
    left_wrist_image: left_wrist_0_color
    right_wrist_image: right_wrist_0_color
  state_stream: robot_state

inference:
  project_root: ${oc.env:JEPA_POLICY_ROOT,../JEPA-Policy}
  config_name: exps/arx_r5_mip_future4_ratio010
  task: ???
  checkpoint: ???
  stats_path: ???
  device: cuda
  num_steps: 2

action_hz: 10.0
