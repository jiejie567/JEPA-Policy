# @package _global_
defaults:
  - /optimization: default
  - /network: chitransformer
  - /task: mug_mug_image
  - /log: default
  - _self_

mode: "train"

optimization:
  loss_type: "mip"
  seed: 2
  device: "cuda"
  disable_cudnn: true
  batch_size: 256
  use_compile: false
  dataloader_num_workers: 2
  dataloader_persistent_workers: false
  gradient_steps: 10
  auto_resume: false
  t_two_step: 0.9
  future_target_type: "embedding"
  use_future_embed_loss: true
  future_embed_loss_mode: "mip_two_step"
  future_joint_mode: true
  future_t_two_step: 0.9
  future_embed_loss_weight: 0.01

network:
  n_future_tokens: 1
  use_causal_mask: false

task:
  future_state_enabled: true
  future_state_steps: 8
  future_target_type: "embedding"

log:
  log_dir: "logs/mug_mug_future8_joint_smoke"
  exp_name: "mug_mug_future8_joint_smoke"
  wandb_mode: "disabled"
  log_freq: 1
  save_freq: 10
  eval_freq: 1000000
  validation_freq: 0
  gradient_diagnostic_freq: 0
