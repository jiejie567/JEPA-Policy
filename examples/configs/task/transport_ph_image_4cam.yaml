# @package task
defaults:
  - robomimic_base
  - _self_

env_name: "transport"
obs_type: "image"
env_type: "ph"

# Four-camera dataset regenerated from the official Transport simulator states.
# Keep this separate from image.hdf5, which only contains robot1_eye_in_hand_image.
dataset_filename: "robomimic/transport/ph/image_4cam.hdf5"

max_episode_steps: 700
render_obs_key: "shouldercamera0_image"

horizon: 10
act_dim: 20  # Absolute-action conversion maps the two 7D arms to 20D actions.

shape_meta:
  action:
    shape:
      - 20
  obs:
    shouldercamera0_image:
      shape:
        - 3
        - 84
        - 84
      type: rgb
    shouldercamera1_image:
      shape:
        - 3
        - 84
        - 84
      type: rgb
    robot0_eye_in_hand_image:
      shape:
        - 3
        - 84
        - 84
      type: rgb
    robot1_eye_in_hand_image:
      shape:
        - 3
        - 84
        - 84
      type: rgb
    robot0_eef_pos:
      shape:
        - 3
      type: low_dim
    robot0_eef_quat:
      shape:
        - 4
      type: low_dim
    robot0_gripper_qpos:
      shape:
        - 2
      type: low_dim
    robot1_eef_pos:
      shape:
        - 3
      type: low_dim
    robot1_eef_quat:
      shape:
        - 4
      type: low_dim
    robot1_gripper_qpos:
      shape:
        - 2
      type: low_dim

num_envs: 4
